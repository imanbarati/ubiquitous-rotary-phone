name: Deploy Enagram to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enagram-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build and typecheck
        run: npm run build

      - name: Create or reuse Cloudflare D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-d1.mjs

      - name: Configure and validate deployment
        env:
          APP_URL: ${{ vars.APP_URL }}
          ENAGRAM_GITHUB_CLIENT_ID: ${{ vars.ENAGRAM_GITHUB_CLIENT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENAGRAM_GITHUB_CLIENT_SECRET: ${{ secrets.ENAGRAM_GITHUB_CLIENT_SECRET }}
        run: |
          node scripts/configure-cloudflare.mjs
          node --input-type=module -e '
            const keys = ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID", "ENAGRAM_GITHUB_CLIENT_SECRET"];
            const missing = keys.filter((key) => !process.env[key] || !process.env[key].trim());
            if (missing.length) {
              console.error("Missing GitHub Actions secrets: " + missing.join(", "));
              process.exit(1);
            }
          '

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply enagram-platform-db --remote --config .wrangler.deploy.jsonc

      - name: Set runtime OAuth secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENAGRAM_GITHUB_CLIENT_SECRET: ${{ secrets.ENAGRAM_GITHUB_CLIENT_SECRET }}
        run: printf '%s' "$ENAGRAM_GITHUB_CLIENT_SECRET" | npx wrangler secret put ENAGRAM_GITHUB_CLIENT_SECRET --name enagram-platform --config .wrangler.deploy.jsonc

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config .wrangler.deploy.jsonc
